name: JA / Refresh translations from poe2db

# Re-runs tools/scrape_poe2db.py against poe2db.tw/jp and opens a PR if any
# translation files changed. Mods.lua is currently not scraped (deferred);
# Stats.lua is hand-maintained and untouched by the scraper.

on:
  schedule:
    - cron: '0 18 * * 0'   # Sundays 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.repository != 'PathOfBuildingCommunity/PathOfBuilding-PoE2'
    steps:
      - name: Checkout ja branch
        uses: actions/checkout@v4
        with:
          ref: ja
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "ja-translate-bot"
          git config user.email "actions@github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Run scraper
        run: python3 tools/scrape_poe2db.py

      - name: Detect translation changes
        id: diff
        run: |
          if git diff --quiet src/Locale/ja_JP/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat src/Locale/ja_JP/ | tee diff-stat.txt
          fi

      - name: Open PR with refreshed dictionaries
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d)
          BRANCH="refresh-poe2db-$DATE"
          git checkout -b "$BRANCH"
          git add src/Locale/ja_JP/
          git commit -m "i18n: refresh translations from poe2db.tw ($DATE)"
          git push origin "$BRANCH"
          DIFF_STAT=$(cat diff-stat.txt 2>/dev/null || echo "(diff stat unavailable)")
          gh pr create \
            --repo "${{ github.repository }}" \
            --base ja \
            --head "$BRANCH" \
            --title "i18n: refresh from poe2db.tw ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          Auto-generated by \`.github/workflows/ja-refresh-translations.yml\`.

          \`tools/scrape_poe2db.py\` detected changes in poe2db.tw/jp translations.

          ## Diff stat
          \`\`\`
          $DIFF_STAT
          \`\`\`

          ## Reviewer checklist
          - [ ] Inspect added/removed entries — sudden bulk removals may indicate poe2db site structure change
          - [ ] Spot-check terminology against \`docs/ja/glossary.md\`
          - [ ] If a translation regresses (e.g. previously correct → now odd), capture it in the override system once that lands
          EOF
          )"
