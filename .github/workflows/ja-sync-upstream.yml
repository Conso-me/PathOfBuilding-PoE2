name: JA / Sync upstream

# Pulls the latest commits from PathOfBuildingCommunity/PathOfBuilding-PoE2
# dev branch into our `ja` branch and opens a PR for review. Manual review is
# intentional — translation conflicts in Locale/ files need a human eye.
#
# This workflow only runs on the fork. Enable GitHub Actions in the fork's
# settings if the scheduled run does not fire.

on:
  schedule:
    - cron: '0 0 * * 1'   # Mondays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'PathOfBuildingCommunity/PathOfBuilding-PoE2'  # safety: never run on upstream
    steps:
      - name: Checkout ja branch
        uses: actions/checkout@v4
        with:
          ref: ja
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "ja-sync-bot"
          git config user.email "actions@github.com"

      - name: Fetch upstream/dev
        run: |
          git remote add upstream https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2.git
          git fetch upstream dev

      - name: Count new upstream commits
        id: diff
        run: |
          NEW=$(git rev-list ja..upstream/dev --count)
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Upstream is $NEW commits ahead of ja"

      - name: Create sync branch and attempt merge
        if: steps.diff.outputs.new != '0'
        id: merge
        run: |
          DATE=$(date +%Y%m%d)
          BRANCH="sync-upstream-$DATE"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"
          if git merge upstream/dev --no-edit; then
            echo "conflict=false" >> $GITHUB_OUTPUT
          else
            echo "conflict=true"  >> $GITHUB_OUTPUT
            # Leave conflict markers in place; let the PR show them
            git add -A
            git commit -m "sync: upstream/dev merge in progress (conflicts present)" --allow-empty
          fi
          git push origin "$BRANCH"

      - name: Open PR
        if: steps.diff.outputs.new != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONFLICT_NOTE=""
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            CONFLICT_NOTE="**⚠️ Merge conflicts present — resolve before merging.**"
          fi
          gh pr create \
            --repo "${{ github.repository }}" \
            --base ja \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "sync: upstream/dev → ja ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          Auto-generated by \`.github/workflows/ja-sync-upstream.yml\`.

          Brings in ${{ steps.diff.outputs.new }} new commit(s) from
          \`PathOfBuildingCommunity/PathOfBuilding-PoE2@dev\` into our \`ja\` branch.

          $CONFLICT_NOTE

          ## Reviewer checklist
          - [ ] Resolve any conflicts (expected only in Locale/ overlay-touched files)
          - [ ] Run \`python3 tools/wrap_ui_calls.py --dry-run\` to catch new UI call sites
          - [ ] Run \`python3 tools/extract_strings.py\` to refresh the translation queue
          - [ ] Run \`python3 tools/coverage_report.py\` to confirm UI coverage
          EOF
          )"
